<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Variant C. The hero card, blown up: blue field, pink and mustard blocks, paper card in the middle.
       Words sit on the card, inside the centre square. -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("font/BricolageGrotesque-800.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
    }
    text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; }
  </style>
  <rect width="1200" height="630" fill="#2665D6"/>
  <circle cx="40" cy="700" r="210" fill="#D2A72A"/>
  <rect x="980" y="-120" width="340" height="340" rx="80" fill="#E9C0E9" transform="rotate(18 1150 50)"/>
  <rect x="-70" y="80" width="150" height="150" rx="40" fill="#780016" transform="rotate(-16 10 150)"/>
  <rect x="270" y="58" width="660" height="514" rx="40" fill="#F3F3F1"/>
  <svg x="534" y="96" width="132" height="132" viewBox="0 0 32 32">
    <defs><clipPath id="lt"><rect width="32" height="32" rx="9"/></clipPath></defs>
    <g clip-path="url(#lt)">
      <rect width="32" height="32" fill="#2665D6"/>
      <circle cx="9" cy="32.5" r="6.5" fill="#D2A72A"/>
      <rect x="20" y="21" width="18" height="18" rx="5" fill="#E9C0E9" transform="rotate(18 29 30)"/>
    </g>
    <path d="M9 7.5 23.5 14l-6.8 2.4-2.5 6.8z" fill="#fff" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>
  <text x="600" y="300" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="100" letter-spacing="-3">Linki</text>
  <text x="600" y="378" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="34">A very good alternative to <tspan fill="#2665D6">bitly</tspan></text>
  <text x="600" y="430" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="22">Short links you can name. See who clicks. No sign-up.</text>
  <rect x="514" y="468" width="172" height="48" rx="24" fill="#1E2330"/>
  <text x="600" y="492" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="22">linki.ing</text>
</svg>
