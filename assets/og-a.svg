<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Variant A. Poster: paper field, corner blocks, stacked mark and type.
       Keep the words inside x=330..870 so a square crop still shows them.
       Wordmark is Bricolage Grotesque 800 (assets/font). -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("font/BricolageGrotesque-800.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
    }
    text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; }
  </style>
  <rect width="1200" height="630" fill="#F3F3F1"/>
  <rect x="-130" y="-150" width="360" height="300" rx="76" fill="#E9C0E9" transform="rotate(-16 50 0)"/>
  <circle cx="8" cy="668" r="168" fill="#D2A72A"/>
  <rect x="1040" y="-90" width="250" height="250" rx="64" fill="#2665D6" transform="rotate(14 1165 35)"/>
  <rect x="1075" y="455" width="210" height="210" rx="52" fill="#780016" transform="rotate(18 1180 560)"/>
  <circle cx="168" cy="248" r="20" fill="#2665D6"/>
  <circle cx="1052" cy="286" r="30" fill="#D2A72A"/>
  <svg x="534" y="78" width="132" height="132" viewBox="0 0 32 32">
    <defs><clipPath id="lt"><rect width="32" height="32" rx="9"/></clipPath></defs>
    <g clip-path="url(#lt)">
      <rect width="32" height="32" fill="#2665D6"/>
      <circle cx="9" cy="32.5" r="6.5" fill="#D2A72A"/>
      <rect x="20" y="21" width="18" height="18" rx="5" fill="#E9C0E9" transform="rotate(18 29 30)"/>
    </g>
    <path d="M9 7.5 23.5 14l-6.8 2.4-2.5 6.8z" fill="#fff" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>
  <text x="600" y="292" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="104" letter-spacing="-3">Linki</text>
  <rect x="568" y="338" width="64" height="10" rx="5" fill="#D2A72A"/>
  <text x="600" y="392" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="36">A very good alternative to <tspan fill="#2665D6">bitly</tspan></text>
  <text x="600" y="444" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="22">Short links you can name. See who clicks. No sign-up.</text>
  <rect x="514" y="478" width="172" height="48" rx="24" fill="#1E2330"/>
  <text x="600" y="502" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="22">linki.ing</text>
</svg>
