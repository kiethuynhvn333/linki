<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Variant B. Blue card on paper, white type, logo beside the wordmark.
       The card sits inside the centre square. Keep words inside the card. -->
  <style>
    @font-face {
      font-family: "Bricolage Grotesque";
      src: url("font/BricolageGrotesque-800.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
    }
    text { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; }
  </style>
  <rect width="1200" height="630" fill="#F3F3F1"/>
  <rect x="-80" y="-90" width="230" height="230" rx="58" fill="#780016" transform="rotate(-14 40 20)"/>
  <circle cx="1160" cy="90" r="70" fill="#E9C0E9"/>
  <circle cx="70" cy="560" r="46" fill="#2665D6"/>
  <rect x="300" y="46" width="600" height="538" rx="40" fill="#2665D6"/>
  <circle cx="860" cy="520" r="92" fill="#D2A72A"/>
  <rect x="760" y="430" width="170" height="170" rx="40" fill="#E9C0E9" transform="rotate(18 845 515)"/>
  <rect x="446" y="168" width="120" height="120" rx="34" fill="#F3F3F1"/>
  <svg x="454" y="176" width="104" height="104" viewBox="0 0 32 32">
    <defs><clipPath id="lt"><rect width="32" height="32" rx="9"/></clipPath></defs>
    <g clip-path="url(#lt)">
      <rect width="32" height="32" fill="#2665D6"/>
      <circle cx="9" cy="32.5" r="6.5" fill="#D2A72A"/>
      <rect x="20" y="21" width="18" height="18" rx="5" fill="#E9C0E9" transform="rotate(18 29 30)"/>
    </g>
    <path d="M9 7.5 23.5 14l-6.8 2.4-2.5 6.8z" fill="#fff" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/>
  </svg>
  <text x="586" y="228" text-anchor="start" dominant-baseline="central" fill="#FFFFFF" font-size="84" letter-spacing="-2">Linki</text>
  <text x="600" y="352" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="32">A very good alternative to <tspan fill="#D2A72A">bitly</tspan></text>
  <text x="600" y="404" text-anchor="middle" dominant-baseline="central" fill="#FFFFFF" font-size="20">Short links you can name. See who clicks. No sign-up.</text>
  <rect x="514" y="446" width="172" height="46" rx="23" fill="#F3F3F1"/>
  <text x="600" y="469" text-anchor="middle" dominant-baseline="central" fill="#1E2330" font-size="20">linki.ing</text>
</svg>
